databases:
  - name: recourse-postgres
    plan: free
    databaseName: recourse
    user: recourse

services:
  - type: web
    name: recourse-razorpay-recovery-api
    runtime: python
    plan: free
    buildCommand: python -m pip install -e .
    startCommand: python -m uvicorn recourse.main:app --app-dir apps/api/src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recourse-postgres
          property: connectionString
      - key: FIXTURE_WEBHOOK_SECRET
        generateValue: true
      - key: COMMAND_SIGNING_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: TEST_MODE
        value: "true"
      - key: OPENROUTER_ENABLED
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RAZORPAY_ENABLED
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://recourse-razorpay-recovery.vercel.app
